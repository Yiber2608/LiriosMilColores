<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Para Katherine ✦</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Italianno&family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    :root {
      --night-deep: #04060f;
      --tulip-yellow-deep: #c74f89;
      --tulip-yellow: #f5c518;
      --tulip-yellow-light: #ffe066;
      --tulip-yellow-bright: #fff4a8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :focus { outline: none; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--night-deep);
      font-family: 'Cormorant Garamond', serif;
      color: #e8e4d0;
      cursor: default;
    }

    /* ===== Cielo nocturno ===== */
    .sky {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 10%, rgba(74, 95, 156, 0.25) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(120, 80, 160, 0.18) 0%, transparent 55%),
        radial-gradient(ellipse at 50% 100%, rgba(20, 58, 35, 0.4) 0%, transparent 60%),
        linear-gradient(180deg, #02030a 0%, #060c1f 35%, #0a1535 65%, #0d1f3d 100%);
      z-index: 0;
    }

    .milky-way {
      position: fixed;
      top: -10%; left: -10%;
      width: 120%; height: 60%;
      background:
        radial-gradient(ellipse 60% 25% at 50% 50%, rgba(180, 200, 255, 0.08) 0%, transparent 70%),
        radial-gradient(ellipse 40% 15% at 45% 55%, rgba(220, 180, 255, 0.05) 0%, transparent 60%);
      transform: rotate(-15deg);
      filter: blur(20px);
      z-index: 1;
      pointer-events: none;
    }

    #particles-canvas {
      position: fixed; inset: 0; z-index: 2; pointer-events: none;
    }

    /* Luna */
    .moon {
      position: fixed;
      top: 8%; right: 12%;
      width: 110px; height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fffaf0 0%, #f5ecd5 40%, #d4c89a 80%, #aa9967 100%);
      box-shadow:
        0 0 40px rgba(255, 245, 200, 0.4),
        0 0 80px rgba(255, 245, 200, 0.25),
        0 0 140px rgba(255, 245, 200, 0.15),
        inset -15px -15px 40px rgba(80, 60, 30, 0.3);
      z-index: 3;
      animation: moonPulse 8s ease-in-out infinite;
    }
    .moon::before {
      content: '';
      position: absolute;
      inset: -30px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 245, 200, 0.15), transparent 70%);
      z-index: -1;
    }
    .moon::after {
      content: '';
      position: absolute;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: rgba(140, 120, 80, 0.25);
      top: 30%; left: 25%;
      box-shadow:
        25px 35px 0 -3px rgba(140, 120, 80, 0.18),
        -8px 45px 0 -6px rgba(140, 120, 80, 0.2),
        40px 15px 0 -8px rgba(140, 120, 80, 0.15);
    }
    @keyframes moonPulse {
      0%, 100% { box-shadow: 0 0 40px rgba(255, 245, 200, 0.4), 0 0 80px rgba(255, 245, 200, 0.25), 0 0 140px rgba(255, 245, 200, 0.15), inset -15px -15px 40px rgba(80, 60, 30, 0.3); }
      50% { box-shadow: 0 0 60px rgba(255, 245, 200, 0.55), 0 0 120px rgba(255, 245, 200, 0.35), 0 0 180px rgba(255, 245, 200, 0.2), inset -15px -15px 40px rgba(80, 60, 30, 0.3); }
    }

    /* Estrellas */
    .stars-static { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle var(--dur, 3s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
    }
    .star.bright { box-shadow: 0 0 6px rgba(255,255,255,0.9), 0 0 12px rgba(180, 200, 255, 0.5); }
    @keyframes twinkle {
      0%, 100% { opacity: var(--max, 1); transform: scale(1); }
      50% { opacity: 0.2; transform: scale(0.6); }
    }

    .shooting-star {
      position: fixed;
      width: 2px; height: 2px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 0 6px white;
      z-index: 3;
      pointer-events: none;
    }

    /* ===== Suelo / tierra ===== */
    .ground {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 28vh;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(45, 138, 82, 0.18) 0%, transparent 70%),
        linear-gradient(180deg, transparent 0%, rgba(15, 53, 32, 0.4) 30%, rgba(8, 30, 18, 0.85) 70%, rgba(20, 12, 6, 0.95) 100%);
      z-index: 4;
      pointer-events: none;
    }

    .soil-mound {
      position: fixed;
      bottom: -24px;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      max-width: 1300px;
      height: 130px;
      background:
        radial-gradient(ellipse at 50% 100%, rgba(58, 40, 24, 0.5) 0%, rgba(30, 22, 13, 0.3) 46%, transparent 72%),
        radial-gradient(ellipse at 50% 100%, rgba(18, 34, 22, 0.55) 0%, transparent 78%);
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
      z-index: 6;
      pointer-events: none;
      filter: blur(12px);
    }

    .grass-blade {
      position: fixed;
      bottom: 0;
      width: 3px;
      background: linear-gradient(to top, #0a2614 0%, #1d5a37 60%, #2d8a52 100%);
      border-radius: 50% 50% 0 0;
      z-index: 7;
      transform-origin: bottom center;
      animation: grassSway 3s ease-in-out infinite;
    }
    @keyframes grassSway {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }

    .mist {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 30vh;
      background: radial-gradient(ellipse at 50% 100%, rgba(140, 180, 200, 0.12) 0%, transparent 60%);
      z-index: 8;
      pointer-events: none;
      animation: mistDrift 20s ease-in-out infinite alternate;
    }
    @keyframes mistDrift {
      from { transform: translateX(-30px); opacity: 0.7; }
      to { transform: translateX(30px); opacity: 1; }
    }

    /* ===== Tulipanes con animación de brote ===== */
    .tulips-stage {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 80vh;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 52px;
      z-index: 10;
      pointer-events: none;
    }

    .tulip {
      position: relative;
      width: 300px;
      height: 78vh;
      transform-origin: bottom center;
      transform: scaleY(0.02) scaleX(0.3);
      opacity: 0;
      animation: bloom 4.5s cubic-bezier(0.34, 1.2, 0.64, 1) forwards;
    }
    .tulip.t1 { animation-delay: 0.3s; }
    .tulip.t2 { animation-delay: 0.8s; z-index: 11; }
    .tulip.t3 { animation-delay: 1.3s; }

    /* Brote: crece desde abajo hacia arriba */
    @keyframes bloom {
      0% {
        transform: scaleY(0.02) scaleX(0.3);
        opacity: 0;
      }
      8% {
        opacity: 1;
      }
      40% {
        transform: scaleY(0.45) scaleX(0.85);
      }
      75% {
        transform: scaleY(0.95) scaleX(1.02);
      }
      90% {
        transform: scaleY(1.02) scaleX(0.98);
      }
      100% {
        transform: scaleY(1) scaleX(1);
        opacity: 1;
      }
    }

    /* Sway sutil después del brote */
    .tulip-inner {
      width: 100%;
      height: 100%;
      transform-origin: bottom center;
      animation: sway 6s ease-in-out infinite;
      animation-delay: 5s;
    }
    @keyframes sway {
      0%, 100% { transform: rotate(-1.5deg); }
      50% { transform: rotate(1.5deg); }
    }

    .tulip svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 10px 25px rgba(0,0,0,0.6));
    }

    /* Resplandor en la base cuando brota */
    .sprout-glow {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 30px;
      background: radial-gradient(ellipse, rgba(255, 220, 100, 0.6) 0%, transparent 70%);
      border-radius: 50%;
      filter: blur(8px);
      opacity: 0;
      animation: sproutGlow 4s ease-out forwards;
    }
    .tulip.t1 .sprout-glow { animation-delay: 0.3s; }
    .tulip.t2 .sprout-glow { animation-delay: 0.8s; }
    .tulip.t3 .sprout-glow { animation-delay: 1.3s; }
    @keyframes sproutGlow {
      0% { opacity: 0; transform: translateX(-50%) scale(0.3); }
      30% { opacity: 1; transform: translateX(-50%) scale(1.2); }
      100% { opacity: 0; transform: translateX(-50%) scale(2); }
    }

    @keyframes fadeInSig { to { opacity: 1; } }

    .hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      color: rgba(232, 228, 208, 0.35);
      text-transform: uppercase;
      z-index: 25;
      animation: hintPulse 3s ease-in-out infinite, fadeInSig 3s ease-out 6.5s forwards;
      opacity: 0;
      pointer-events: none;
    }
    @keyframes hintPulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.8; }
    }

    /* Letras ocultas removidas (ya no se muestran en las hojas) */
    .leaf-letter { display: none; }

    /* Luciérnagas */
    .firefly {
      position: fixed;
      width: 4px; height: 4px;
      background: #fff4a8;
      border-radius: 50%;
      box-shadow: 0 0 8px #fff4a8, 0 0 16px rgba(255, 220, 100, 0.6), 0 0 30px rgba(255, 200, 80, 0.4);
      z-index: 15;
      pointer-events: none;
      opacity: 0;
      animation: fireflyFloat var(--fdur, 12s) ease-in-out infinite, fireflyBlink 2s ease-in-out infinite, fadeInSig 2s ease-out 7s forwards;
    }
    @keyframes fireflyFloat {
      0%   { transform: translate(0, 0); }
      25%  { transform: translate(40px, -60px); }
      50%  { transform: translate(-30px, -100px); }
      75%  { transform: translate(50px, -50px); }
      100% { transform: translate(0, 0); }
    }
    @keyframes fireflyBlink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    /* ===== Lirios del suelo ===== */
    #lilies-container {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 32vh;
      z-index: 5;
      pointer-events: none;
      overflow: hidden;
    }
    @keyframes lilyAppear {
      from { opacity: 0; transform: scale(0.1); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* ===== Tulipanes interactivos ===== */
    /* click preciso: solo las formas reales de la flor, no toda la columna */
    .tulip { pointer-events: none; }
    .tulip svg { transition: filter 0.4s ease; pointer-events: none; }
    .tulip svg > * { pointer-events: auto; cursor: pointer; }
    .tulip .flower-aura { pointer-events: none; }
    .tulip:hover svg {
      filter: drop-shadow(0 0 18px rgba(255,150,200,0.6)) drop-shadow(0 10px 25px rgba(0,0,0,0.6));
    }
    .tulip.active svg {
      filter: drop-shadow(0 0 34px rgba(255,120,180,0.9)) drop-shadow(0 10px 25px rgba(0,0,0,0.6));
    }

    /* ===== Aura luminosa de cada flor ===== */
    .flower-aura {
      transform-box: fill-box;
      transform-origin: center;
      mix-blend-mode: screen;
      animation: auraPulse 5s ease-in-out infinite;
    }
    @keyframes auraPulse {
      0%, 100% { opacity: 0.5;  transform: scale(1); }
      50%      { opacity: 0.95; transform: scale(1.16); }
    }
    .tulip.t2 .flower-aura { animation-delay: 0.6s; }
    .tulip.t3 .flower-aura { animation-delay: 1.1s; }
    .tulip.active .flower-aura { animation-duration: 2.6s; }

    /* ===== Estallido de pétalos al tocar una flor ===== */
    .burst-petal {
      position: fixed;
      border-radius: 50% 50% 50% 0;
      transform: translate(-50%, -50%);
      z-index: 30;
      pointer-events: none;
    }

    /* ===== Pétalos flotando (ambiente permanente) ===== */
    .ambient-petal {
      position: fixed;
      z-index: 14;
      pointer-events: none;
      border-radius: 50% 50% 50% 0;
      box-shadow: 0 0 6px rgba(255, 220, 150, 0.35);
    }

    /* ===== Relámpago (modo lluvia) ===== */
    .lightning {
      position: fixed; inset: 0;
      background: #dbe9ff;
      opacity: 0;
      z-index: 9;
      pointer-events: none;
    }

    /* ===== Disco de lirios locos ===== */
    .disco {
      position: fixed; inset: 0;
      z-index: 9;
      opacity: 0;
      mix-blend-mode: screen;
      pointer-events: none;
    }
    body.lilies-crazy .disco { animation: disco 0.5s steps(1) infinite; }
    @keyframes disco {
      0%   { opacity: 0.16; background: radial-gradient(circle at 28% 38%, #ff1493, transparent 55%); }
      33%  { opacity: 0.16; background: radial-gradient(circle at 72% 30%, #00e5ff, transparent 55%); }
      66%  { opacity: 0.16; background: radial-gradient(circle at 50% 72%, #76ff03, transparent 55%); }
      100% { opacity: 0.16; background: radial-gradient(circle at 28% 38%, #ff1493, transparent 55%); }
    }
    body.lilies-crazy #lilies-container {
      transform-origin: 50% 100%;
      animation: gardenThrob 0.85s ease-in-out infinite;
    }
    @keyframes gardenThrob {
      0%, 100% { transform: scale(1);    filter: hue-rotate(0deg)  saturate(1.4) brightness(1.1); }
      50%      { transform: scale(1.07); filter: hue-rotate(70deg) saturate(2)   brightness(1.35); }
    }

    /* ===== Colibríes secretos ===== */
    .colibri {
      position: fixed;
      z-index: 16;
      width: 110px; height: 84px;
      pointer-events: none;              /* el área de click precisa la dan las formas del SVG */
      -webkit-user-select: none;
      user-select: none;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.5));
      animation: birdFly 28s ease-in-out infinite;
      transition: filter 0.4s ease, opacity 1.2s ease;
    }
    .colibri svg > * { pointer-events: auto; cursor: pointer; }
    .colibri:hover {
      filter: drop-shadow(0 0 15px rgba(180,220,255,0.8)) drop-shadow(0 6px 10px rgba(0,0,0,0.5));
    }
    /* saludo solo del pajarito principal */
    .colibri-hint {
      position: absolute;
      top: -24px; left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      font-family: 'Great Vibes', cursive;
      font-size: 1.35rem;
      color: rgba(255, 244, 200, 0.92);
      text-shadow: 0 0 12px rgba(255, 220, 120, 0.6);
      opacity: 0;
      pointer-events: none;
    }
    .colibri.main-bird .colibri-hint { animation: hintBreathe 3.6s ease-in-out infinite; }
    @keyframes hintBreathe { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.9; } }
    /* bandada: oculta (.pre) hasta que se elige el ánimo */
    .colibri.pre { opacity: 0 !important; }
    .colibri.pre svg > * { pointer-events: none; cursor: default; }
    @keyframes birdFly {
      0%   { transform: translate(0, 0)              rotate(-3deg); }
      15%  { transform: translate(24vw, -7vh)        rotate(3deg); }
      30%  { transform: translate(48vw, 5vh)         rotate(-2deg); }
      48%  { transform: translate(72vw, -9vh)        rotate(4deg); }
      52%  { transform: translate(72vw, -9vh) scaleX(-1) rotate(-4deg); }
      66%  { transform: translate(50vw, 6vh)  scaleX(-1) rotate(3deg); }
      82%  { transform: translate(24vw, -5vh) scaleX(-1) rotate(-3deg); }
      99%  { transform: translate(0, 0)       scaleX(-1) rotate(3deg); }
      100% { transform: translate(0, 0)              rotate(-3deg); }
    }
    .colibri svg { width: 100%; height: 100%; overflow: visible; display: block; pointer-events: none; }
    .colibri .wing {
      transform-box: fill-box;
      transform-origin: 22% 34%;
      animation: flap 0.09s ease-in-out infinite alternate;
    }
    @keyframes flap {
      from { transform: rotate(-30deg) scaleY(0.82); }
      to   { transform: rotate(36deg)  scaleY(1.06); }
    }
    /* el pajarito principal flota en su sitio: nunca vuela de espaldas ni gira el texto */
    @keyframes birdHover {
      0%, 100% { transform: translate(0, 0)      rotate(-2deg); }
      25%      { transform: translate(16px,-18px) rotate(3deg); }
      50%      { transform: translate(4px,-8px)   rotate(-1deg); }
      75%      { transform: translate(-12px,-20px) rotate(3deg); }
    }
    .colibri.main-bird { animation-name: birdHover; }

    /* ===== Pajarito cartero + carta ===== */
    .letter-bird {
      position: fixed;
      z-index: 17;
      width: 66px; height: 50px;
      top: 30%; left: 82%;
      pointer-events: none;
      -webkit-user-select: none; user-select: none;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.45));
      animation: letterFly 26s ease-in-out infinite;
      transition: filter 0.4s ease;
    }
    .letter-bird svg { width: 100%; height: 100%; overflow: visible; display: block; pointer-events: none; }
    .letter-bird svg > * { pointer-events: auto; cursor: pointer; }
    .letter-bird:hover { filter: drop-shadow(0 0 14px rgba(255,180,210,0.9)) drop-shadow(0 6px 10px rgba(0,0,0,0.45)); }
    .letter-bird .lwing { transform-box: fill-box; transform-origin: center; animation: lflap 0.5s ease-in-out infinite alternate; }
    .letter-bird .lwing-r { animation-delay: 0.05s; }
    @keyframes lflap { from { transform: rotate(-16deg); } to { transform: rotate(16deg); } }
    @keyframes letterFly {
      0%   { transform: translate(0, 0)          rotate(-2deg); }
      25%  { transform: translate(-24vw, 9vh)    rotate(2deg); }
      50%  { transform: translate(-50vw, -6vh)   rotate(-2deg); }
      75%  { transform: translate(-26vw, 11vh)   rotate(2deg); }
      100% { transform: translate(0, 0)          rotate(-2deg); }
    }

    .letter-card {
      position: fixed;
      z-index: 20;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.94);
      width: min(90vw, 560px);
      max-height: 80vh; overflow: auto;
      background: linear-gradient(180deg, #fff6fb 0%, #ffe9f2 100%);
      border: 1px solid #f4c8d8;
      border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px rgba(255,150,200,0.25);
      padding: 30px 32px;
      text-align: center;
      color: #6a3a4d;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    body.letter-open .letter-card { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
    .letter-card .lc-title {
      font-family: 'Great Vibes', cursive; font-weight: 400;
      font-size: clamp(1.7rem, 5vw, 2.5rem); color: #d05f92; margin-bottom: 12px;
    }
    .letter-card .lc-msg {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1rem, 2.8vw, 1.26rem); line-height: 1.7;
      text-align: left;
    }
    .letter-card .lc-msg p { margin: 0 0 0.9em; }
    .lc-seal { font-size: 2.6rem; margin-bottom: 8px; }
    .lc-hint { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.1rem; margin-bottom: 16px; color: #8a5266; }
    .lc-pin {
      font-family: inherit; font-size: 1.1rem; text-align: center; letter-spacing: 0.15em;
      padding: 10px 14px; width: 220px; max-width: 82%;
      border: 1px solid #e6a9c0; border-radius: 10px; background: #fff; color: #6a3a4d; outline: none;
    }
    .lc-unlock, .lc-send {
      display: inline-block; margin-top: 14px; cursor: pointer;
      font-family: 'Cormorant Garamond', serif; font-size: 1.05rem;
      color: #fff; background: linear-gradient(180deg, #ff8fbf, #e05f92);
      border: none; border-radius: 10px; padding: 10px 22px;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .lc-unlock:hover, .lc-send:hover { transform: translateY(-2px); filter: brightness(1.05); }
    .lc-error { color: #c0396b; font-style: italic; margin-top: 10px; min-height: 1.2em; }
    .lc-reply { margin-top: 22px; padding-top: 18px; border-top: 1px dashed #f0c0d4; text-align: center; }
    .lc-reply-label { font-family: 'Great Vibes', cursive; font-size: 1.5rem; color: #d05f92; margin-bottom: 10px; }
    .lc-reply-text {
      width: 100%; font-family: 'Cormorant Garamond', serif; font-size: 1.05rem;
      padding: 12px 14px; border: 1px solid #e6a9c0; border-radius: 10px;
      background: #fff; color: #6a3a4d; resize: vertical; outline: none;
    }
    .lc-sent { color: #8a5266; font-style: italic; margin-top: 8px; min-height: 1.2em; }
    .letter-card .lc-close {
      margin-top: 20px; font-size: 0.72rem; letter-spacing: 0.25em;
      text-transform: uppercase; color: #c79bb0;
    }

    /* ===== Mariposas de colores (ánimo triste) ===== */
    .butterfly {
      position: fixed;
      z-index: 16;
      width: 72px; height: 56px;
      pointer-events: none;
      -webkit-user-select: none; user-select: none;
      filter: drop-shadow(0 6px 9px rgba(0,0,0,0.4));
      animation: flutterFly 20s ease-in-out infinite;
      transition: filter 0.4s ease, opacity 1.2s ease;
    }
    .butterfly svg { width: 100%; height: 100%; overflow: visible; display: block; pointer-events: none; }
    .butterfly svg > * { pointer-events: auto; cursor: pointer; }
    .butterfly:hover { filter: drop-shadow(0 0 15px rgba(255,170,235,0.9)) drop-shadow(0 6px 9px rgba(0,0,0,0.4)); }
    .butterfly .bwing { transform-box: fill-box; animation: bflap 0.34s ease-in-out infinite alternate; }
    .butterfly .bwing-l { transform-origin: right center; }
    .butterfly .bwing-r { transform-origin: left center; }
    @keyframes bflap { from { transform: scaleX(1); } to { transform: scaleX(0.5); } }
    @keyframes flutterFly {
      0%   { transform: translate(0, 0)         rotate(-6deg); }
      20%  { transform: translate(18vw, -12vh)  rotate(8deg); }
      40%  { transform: translate(40vw, 4vh)    rotate(-8deg); }
      60%  { transform: translate(60vw, -14vh)  rotate(6deg); }
      80%  { transform: translate(30vw, 6vh)    rotate(-6deg); }
      100% { transform: translate(0, 0)         rotate(-6deg); }
    }
    .butterfly.pre { opacity: 0 !important; }
    .butterfly.pre svg > * { pointer-events: none; cursor: default; }
    body.bird-reveal .butterfly {
      animation-play-state: paused;
      opacity: 0.22;
      transition: opacity 1s ease;
    }
    body.bird-reveal .butterfly.bird-active {
      opacity: 1;
      z-index: 19;
      filter: drop-shadow(0 0 20px rgba(255,170,235,0.9)) drop-shadow(0 6px 9px rgba(0,0,0,0.4));
    }

    /* ===== Chiste malo (2 opciones) ===== */
    .joke {
      position: fixed;
      z-index: 21;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: min(92vw, 640px);
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }
    body.joke-open .joke { opacity: 1; pointer-events: auto; }
    .joke-q {
      font-family: 'Cormorant Garamond', serif; font-style: italic;
      font-size: clamp(1.2rem, 3.6vw, 2rem);
      color: #fff2c8; text-shadow: 0 0 18px rgba(255,200,120,0.4);
      margin-bottom: 24px; line-height: 1.4;
    }
    .joke-opts { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
    .joke-opt {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1rem, 2.7vw, 1.35rem);
      color: #fff; background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.35); border-radius: 12px;
      padding: 13px 18px; cursor: pointer; max-width: 46%;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
    }
    .joke-opt:hover { background: rgba(255,255,255,0.18); transform: translateY(-2px); }
    .joke-opt.ok { background: rgba(120,230,140,0.25); border-color: #7ee68c; }
    .joke-opt.no { background: rgba(255,120,120,0.2); border-color: #ff8f8f; }
    .joke-result {
      margin-top: 22px; min-height: 1.4em;
      font-family: 'Great Vibes', cursive; font-size: clamp(1.5rem, 4.4vw, 2.4rem);
      color: #ffe6a8; text-shadow: 0 0 16px rgba(255,200,120,0.4);
      opacity: 0; transition: opacity 0.5s ease;
    }
    .joke-result.show { opacity: 1; }
    .joke-result small {
      display: block; margin-top: 6px;
      font-family: 'Cormorant Garamond', serif; font-style: italic;
      font-size: 0.42em; letter-spacing: 0.18em; color: rgba(255,255,255,0.55);
    }

    /* ===== Revelación oculta y melancólica ===== */
    .reveal-veil {
      position: fixed; inset: 0;
      z-index: 18;
      background: radial-gradient(ellipse at 50% 38%, rgba(12,20,48,0.30) 0%, rgba(3,5,14,0.88) 78%);
      -webkit-backdrop-filter: blur(3px);
      backdrop-filter: blur(3px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 2.6s ease;
    }
    body.bird-reveal .reveal-veil,
    body.letter-open .reveal-veil { opacity: 1; pointer-events: auto; cursor: pointer; }

    .reveal-star {
      position: fixed;
      z-index: 19;
      top: 26%; left: 50%;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #fffbe8;
      box-shadow: 0 0 22px #fff, 0 0 60px #ffe9a8, 0 0 130px rgba(255,210,120,0.6);
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.2);
      pointer-events: none;
      transition: opacity 1.6s ease;
    }
    .reveal-star::before, .reveal-star::after {
      content: '';
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      background: linear-gradient(currentColor, transparent);
      color: rgba(255, 240, 200, 0.85);
    }
    .reveal-star::before { width: 2px;  height: 190px; background: linear-gradient(transparent, #fff6d8, transparent); }
    .reveal-star::after  { width: 190px; height: 2px; background: linear-gradient(90deg, transparent, #fff6d8, transparent); }
    body.bird-reveal .reveal-star { animation: starRise 6s ease-out forwards; }
    @keyframes starRise {
      0%   { opacity: 0; transform: translate(-50%, 42vh) scale(0.2) rotate(0deg); }
      25%  { opacity: 1; }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(180deg); }
    }

    .reveal-text {
      position: fixed;
      z-index: 20;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: min(92vw, 780px);
      text-align: center;
      pointer-events: none;
    }
    .reveal-text .rt-main {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(1.05rem, 2.7vw, 1.65rem);
      line-height: 1.65;
      color: rgba(240, 236, 220, 0.96);
      letter-spacing: 0.02em;
      text-shadow: 0 0 22px rgba(140, 170, 235, 0.45);
      opacity: 0;
      transform: translateY(18px);
      margin: 0;
      transition: opacity 1.6s ease;
    }
    .reveal-text .rt-main.show { animation: lineIn 2.6s ease-out forwards; }
    @keyframes lineIn { to { opacity: 1; transform: translateY(0); } }

    body.bird-reveal .colibri {
      animation-play-state: paused;
      opacity: 0.22;
      transition: opacity 1s ease;
    }
    body.bird-reveal .colibri.bird-active {
      opacity: 1;
      z-index: 19;
      filter: drop-shadow(0 0 22px rgba(180, 210, 255, 0.9)) drop-shadow(0 6px 10px rgba(0,0,0,0.5));
    }
    body.bird-reveal .colibri .wing { animation-duration: 0.5s; }
    body.bird-reveal .hint { opacity: 0 !important; }

    .stardust {
      position: fixed;
      z-index: 20;
      pointer-events: none;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    /* ===== Selector de ánimo (dos huevos con pollitos) ===== */
    .mood-chooser {
      position: fixed;
      z-index: 22;
      left: 50%; top: 61%;
      transform: translateX(-50%);
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease;
    }
    .mood-chooser.show { opacity: 1; pointer-events: auto; }
    .mood-q {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(1.5rem, 4.5vw, 2.4rem);
      color: rgba(255, 244, 200, 0.95);
      text-shadow: 0 0 16px rgba(255, 220, 130, 0.5);
      margin-bottom: 14px;
    }
    .mood-eggs { display: flex; gap: 46px; justify-content: center; }
    .egg-btn {
      background: none; border: none; outline: none; padding: 0;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.45));
      transition: transform 0.25s ease, filter 0.25s ease;
    }
    .egg-btn svg { width: 88px; height: 100px; display: block; }
    .egg-btn span {
      font-family: 'Cormorant Garamond', serif; font-style: italic;
      font-size: 1.05rem; letter-spacing: 0.1em;
      color: rgba(233, 228, 208, 0.85);
    }
    .egg-btn:hover { transform: translateY(-6px) scale(1.06); filter: drop-shadow(0 0 18px rgba(255, 220, 140, 0.65)); }
    .egg-btn .chick {
      transform-box: fill-box; transform-origin: 50% 90%;
      animation: chickBob 1.7s ease-in-out infinite;
    }
    .egg-btn[data-mood="triste"] .chick { animation-duration: 2.4s; }
    @keyframes chickBob {
      0%, 100% { transform: translateY(0) rotate(-2.5deg); }
      50%      { transform: translateY(-4px) rotate(2.5deg); }
    }

    /* ===== Modo día ===== */
    .day-sky {
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg,
        #0a3d7a 0%, #1565c0 15%, #1e88e5 30%,
        #42a5f5 50%, #90caf9 70%,
        #c5e8f0 88%, #e8f5e9 100%);
      z-index: 0;
      opacity: 0;
      transition: opacity 3s ease;
      pointer-events: none;
    }
    body.day-mode .day-sky     { opacity: 1; }
    body.day-mode .milky-way   { opacity: 0; transition: opacity 2s ease; }
    body.day-mode .stars-static { opacity: 0; transition: opacity 2s ease; }
    body.day-mode .moon        { opacity: 0 !important; transition: opacity 2s ease; }
    body.day-mode .ground {
      background:
        radial-gradient(ellipse at 50% 0%, rgba(80,200,100,0.3) 0%, transparent 70%),
        linear-gradient(180deg, transparent 0%, rgba(50,140,60,0.55) 30%, rgba(30,100,40,0.85) 70%, rgba(15,60,20,0.95) 100%);
      transition: background 3s ease;
    }

    .sun {
      position: fixed;
      top: 8%; right: 12%;
      width: 110px; height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fffde7 0%, #fff176 30%, #ffca28 60%, #ff8f00 100%);
      box-shadow:
        0 0 0 22px rgba(255,220,50,0.12),
        0 0 0 44px rgba(255,200,0,0.08),
        0 0 0 72px rgba(255,180,0,0.05),
        0 0 65px  rgba(255,230,50,0.8),
        0 0 130px rgba(255,180,0,0.5),
        0 0 220px rgba(255,120,0,0.25);
      z-index: 3;
      opacity: 0;
      transition: opacity 2.5s ease;
      pointer-events: none;
      animation: sunPulse 7s ease-in-out infinite;
    }
    body.day-mode .sun { opacity: 1; }
    @keyframes sunPulse {
      0%,100% { transform: scale(1); }
      50%     { transform: scale(1.05); }
    }

    /* ===== Lluvia ===== */
    #rain-canvas {
      position: fixed;
      inset: 0;
      z-index: 9;
      pointer-events: none;
      display: none;
    }

    @media (max-width: 768px) {
      .tulips-stage { gap: 8px; }
      .tulip { width: 165px; }
      .moon { width: 70px; height: 70px; top: 5%; right: 8%; }
    }
  </style>
</head>

  <script>
    (function generateStars() {
      const container = document.getElementById('stars');
      const count = 180;
      for (let i = 0; i < count; i++) {
        const star = document.createElement('div');
        star.className = 'star' + (Math.random() > 0.85 ? ' bright' : '');
        const size = Math.random() * 2.5 + 0.5;
        star.style.width = size + 'px';
        star.style.height = size + 'px';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 75 + '%';
        star.style.setProperty('--dur', (Math.random() * 4 + 2) + 's');
        star.style.setProperty('--delay', (Math.random() * 5) + 's');
        star.style.setProperty('--max', (Math.random() * 0.6 + 0.4));
        container.appendChild(star);
      }
    })();

    (function generateGrass() {
      const container = document.getElementById('grass-container');
      const count = 60;
      for (let i = 0; i < count; i++) {
        const blade = document.createElement('div');
        blade.className = 'grass-blade';
        const height = 8 + Math.random() * 18;
        blade.style.height = height + 'px';
        blade.style.left = Math.random() * 100 + '%';
        blade.style.animationDelay = (Math.random() * 3) + 's';
        blade.style.animationDuration = (2 + Math.random() * 2) + 's';
        container.appendChild(blade);
      }
    })();

    function createShootingStar() {
      const star = document.createElement('div');
      star.className = 'shooting-star';
      const startX = Math.random() * window.innerWidth;
      const startY = Math.random() * (window.innerHeight * 0.4);
      const angle = -25 + Math.random() * 20;
      const distance = 400 + Math.random() * 300;

      star.style.left = startX + 'px';
      star.style.top = startY + 'px';
      document.body.appendChild(star);

      const endX = startX + Math.cos(angle * Math.PI / 180) * distance;
      const endY = startY + Math.sin(angle * Math.PI / 180) * distance + 200;

      star.animate([
        { transform: `translate(0, 0)`, opacity: 0 },
        { opacity: 1, offset: 0.1 },
        { opacity: 1, offset: 0.7 },
        { transform: `translate(${endX - startX}px, ${endY - startY}px)`, opacity: 0 }
      ], {
        duration: 1500 + Math.random() * 1000,
        easing: 'cubic-bezier(0.4, 0, 0.6, 1)'
      }).onfinish = () => star.remove();
    }
    setInterval(createShootingStar, 4500);
    setTimeout(createShootingStar, 1500);

    (function createGroundLilies() {
      const container = document.getElementById('lilies-container');
      const ns = 'http://www.w3.org/2000/svg';
      const palettes = [
        ['#ff69b4','#ff1493','#ffb6c1'],
        ['#4169e1','#6495ed','#87ceeb'],
        ['#dc143c','#e63946','#ff4500'],
        ['#9370db','#da70d6','#ba55d3'],
        ['#ff6347','#ffa07a','#ff8c69'],
        ['#ffffff','#ffe4e1','#fff0f5'],
      ];
      const allColors = palettes.flat();

      for (let i = 0; i < 110; i++) {
        const x    = Math.random() * 100;
        const y    = Math.random() * 85 + 3;
        const size = 5 + Math.random() * 11;
        const color = allColors[Math.floor(Math.random() * allColors.length)];
        const numP  = 5 + Math.floor(Math.random() * 2);
        const rot   = Math.random() * 360;
        const delay = 7 + Math.random() * 4;
        const hl    = size * 0.58;
        const pw    = size * 0.26;
        const vs    = size * 2.6;

        const wrap = document.createElement('div');
        wrap.style.cssText =
          `position:absolute;left:${x}%;bottom:${y}%;` +
          `transform:translate(-50%,50%);width:${vs}px;height:${vs}px;`;

        const svg = document.createElementNS(ns, 'svg');
        svg.setAttribute('width', vs);
        svg.setAttribute('height', vs);
        svg.setAttribute('viewBox', `${-vs/2} ${-vs/2} ${vs} ${vs}`);
        svg.style.cssText =
          `display:block;overflow:visible;` +
          `animation:lilyAppear 1.2s ease-out ${delay}s both;`;

        const g = document.createElementNS(ns, 'g');
        g.setAttribute('transform', `rotate(${rot})`);

        for (let p = 0; p < numP; p++) {
          const ang = (p / numP) * 360;
          const pg = document.createElementNS(ns, 'g');
          pg.setAttribute('transform', `rotate(${ang})`);
          const petal = document.createElementNS(ns, 'ellipse');
          petal.setAttribute('cx', '0');
          petal.setAttribute('cy', -hl);
          petal.setAttribute('rx', pw);
          petal.setAttribute('ry', hl);
          petal.setAttribute('fill', color);
          petal.setAttribute('data-orig', color);
          petal.setAttribute('opacity', '0.9');
          petal.classList.add('lily-petal');
          pg.appendChild(petal);
          g.appendChild(pg);
        }

        /* Estambres visibles desde el interior */
        const stamenCount = numP;
        for (let s = 0; s < stamenCount; s++) {
          const ang = (s / stamenCount) * 360 + 180 / stamenCount;
          const sg = document.createElementNS(ns, 'g');
          sg.setAttribute('transform', `rotate(${ang})`);
          const stamen = document.createElementNS(ns, 'line');
          stamen.setAttribute('x1', '0'); stamen.setAttribute('y1', '0');
          stamen.setAttribute('x2', '0'); stamen.setAttribute('y2', -(hl * 0.55));
          stamen.setAttribute('stroke', '#ffd700');
          stamen.setAttribute('stroke-width', pw * 0.35);
          stamen.setAttribute('stroke-linecap', 'round');
          const tip = document.createElementNS(ns, 'circle');
          tip.setAttribute('cx', '0'); tip.setAttribute('cy', -(hl * 0.55));
          tip.setAttribute('r', pw * 0.45); tip.setAttribute('fill', '#fff176');
          sg.appendChild(stamen); sg.appendChild(tip);
          g.appendChild(sg);
        }

        const center = document.createElementNS(ns, 'circle');
        center.setAttribute('cx', '0'); center.setAttribute('cy', '0');
        center.setAttribute('r', size * 0.28); center.setAttribute('fill', '#fff9c4');
        const dot = document.createElementNS(ns, 'circle');
        dot.setAttribute('cx', '0'); dot.setAttribute('cy', '0');
        dot.setAttribute('r', size * 0.13); dot.setAttribute('fill', '#ffca28');

        g.appendChild(center);
        g.appendChild(dot);
        svg.appendChild(g);
        wrap.appendChild(svg);
        container.appendChild(wrap);
      }
    })();

    let activeMode = null;

    function setMode(mode) {
      if (activeMode === mode) {
        stopMode(activeMode);
        activeMode = null;
        return;
      }
      if (activeMode) stopMode(activeMode);
      closeReveal(); stopBirdSong();   // corta la música de criaturas para dar paso a la del tulipán
      hideChooser();
      activeMode = mode;
      songs[mode].currentTime = 0;
      songs[mode].play().catch(() => {});
      const tulipEl = document.querySelector('.tulip.' + mode);
      if (tulipEl) { tulipEl.classList.add('active'); celebrationBurst(mode); }
      if (mode === 't1') enableDay();
      if (mode === 't2') enableRain();
      if (mode === 't3') enableCrazyLilies();
    }

    function stopMode(mode) {
      songs[mode].pause();
      songs[mode].currentTime = 0;
      const tulipEl = document.querySelector('.tulip.' + mode);
      if (tulipEl) tulipEl.classList.remove('active');
      if (mode === 't1') disableDay();
      if (mode === 't2') disableRain();
      if (mode === 't3') disableCrazyLilies();
    }

    document.querySelector('.tulip.t1').addEventListener('click', () => setMode('t1'));

    ============================================================ */
    const rainCanvas = document.getElementById('rain-canvas');
    const rainCtx    = rainCanvas.getContext('2d');
    let rainDrops = [], rainId = null;

    function enableRain() {
      rainCanvas.width  = window.innerWidth;
      rainCanvas.height = window.innerHeight;
      rainCanvas.style.display = 'block';
      rainDrops = Array.from({ length: 260 }, () => ({
        x:  Math.random() * rainCanvas.width,
        y:  Math.random() * rainCanvas.height,
        len:   12 + Math.random() * 18,
        speed:  9 + Math.random() * 10,
        op:   0.25 + Math.random() * 0.45,
        w:    0.8 + Math.random() * 0.8
      }));
      animateRain();
      scheduleLightning();
    }

    /* Relámpagos que iluminan la escena durante la lluvia */
    const lightningEl = document.querySelector('.lightning');
    let lightningTimer = null;
    function scheduleLightning() {
      lightningTimer = setTimeout(() => {
        flashLightning();
        scheduleLightning();
      }, 3500 + Math.random() * 6500);
    }
    function flashLightning() {
      lightningEl.animate([
        { opacity: 0 },
        { opacity: 0.7,  offset: 0.04 },
        { opacity: 0.1,  offset: 0.1 },
        { opacity: 0.55, offset: 0.16 },
        { opacity: 0,    offset: 0.45 },
        { opacity: 0 }
      ], { duration: 1200, easing: 'ease-out' });
    }

    function animateRain() {
      rainCtx.clearRect(0, 0, rainCanvas.width, rainCanvas.height);
      rainDrops.forEach(d => {
        rainCtx.beginPath();
        rainCtx.moveTo(d.x, d.y);
        rainCtx.lineTo(d.x - 3, d.y + d.len);
        rainCtx.strokeStyle = `rgba(180, 220, 245, ${d.op})`;
        rainCtx.lineWidth = d.w;
        rainCtx.stroke();
        d.y += d.speed;
        if (d.y > rainCanvas.height) { d.y = -d.len; d.x = Math.random() * rainCanvas.width; }
      });
      rainId = requestAnimationFrame(animateRain);
    }

    function disableRain() {
      cancelAnimationFrame(rainId);
      rainId = null;
      rainCtx.clearRect(0, 0, rainCanvas.width, rainCanvas.height);
      rainCanvas.style.display = 'none';
      clearTimeout(lightningTimer);
      lightningTimer = null;
    }

    function celebrationBurst(mode) {
      const el = document.querySelector('.tulip.' + mode);
      if (!el) return;
      const r  = el.getBoundingClientRect();
      const ox = r.left + r.width / 2;
      const oy = r.top + r.height * 0.16;
      const palette = ['#fff4a8', '#ffd54a', '#ff8fbf', '#ff5fa2', '#8be9ff', '#b388ff', '#7cff6b', '#ffffff'];
      for (let i = 0; i < 42; i++) {
        const p  = document.createElement('div');
        p.className = 'burst-petal';
        const c  = palette[Math.floor(Math.random() * palette.length)];
        const sz = 6 + Math.random() * 12;
        p.style.left = ox + 'px';
        p.style.top  = oy + 'px';
        p.style.width  = sz + 'px';
        p.style.height = sz + 'px';
        p.style.background = c;
        p.style.boxShadow  = '0 0 ' + (sz * 0.9) + 'px ' + c;
        document.body.appendChild(p);
        const ang  = Math.random() * Math.PI * 2;
        const dist = 100 + Math.random() * 260;
        const dx   = Math.cos(ang) * dist;
        const dy   = Math.sin(ang) * dist - 80;
        const rot  = Math.random() * 720 - 360;
        p.animate([
          { transform: 'translate(-50%,-50%) rotate(0deg) scale(1)', opacity: 1 },
          { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) rotate(${rot}deg) scale(0.25)`, opacity: 0 }
        ], { duration: 1100 + Math.random() * 800, easing: 'cubic-bezier(0.15,0.75,0.3,1)' })
         .onfinish = () => p.remove();
      }
    }

      { q: "¿Por qué los fantasmas no mienten?", correcta: "Porque se les ve a través.", falsa: "Porque siempre están transparentes." },
      { q: "¿Qué le dice un semáforo a otro?", correcta: "No te pongas rojo, que yo estoy verde.", falsa: "Cambia de luz, que estoy cansado." },
      { q: "¿Cómo se llama el perro de un mago?", correcta: "Ladrín.", falsa: "Abracane." }
    ];
    let chisteCache = [];
    async function loadChistes() {
      try {
        const r = await fetch('/api/chiste?n=8', { cache: 'no-store' });
        if (r.ok) {
          const d = await r.json();
          if (Array.isArray(d.chistes) && d.chistes.length) { chisteCache = d.chistes; return; }
        }
      } catch (_) { /* offline o sin backend: usamos respaldo */ }
      chisteCache = CHISTES.slice();
    }

    /* ── Estado ────────────────────────────────────────────────── */
    let mood = 'triste';
    let phraseCache = [];
    let currentBird = null, currentBirdAudio = null;
    let songLockUntil = 0, playlistIndex = 0;
    const flock = [];
    let flockSpawned = false, flockKind = null;
    let currentJoke = null, jokeTimer = null;
    let phraseQueue = [], lastPhrase = null;   // cola barajada para no repetir frases
    let jokeQueue = [],   lastJoke = null;      // cola barajada para no repetir chistes
    function shuffleArr(a) {
      const c = a.slice();
      for (let i = c.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [c[i], c[j]] = [c[j], c[i]]; }
      return c;
    }

    /* ── Frases IA según el ánimo elegido ──────────────────────── */
    async function loadPhrases(m) {
      const useMood = m || mood;
      try {
        const r = await fetch('/api/frases?n=12&mood=' + useMood, { cache: 'no-store' });
        if (r.ok) {
          const d = await r.json();
          if (Array.isArray(d.frases) && d.frases.length) { phraseCache = d.frases; return; }
        }
      } catch (_) { /* offline o sin backend: usamos respaldo */ }
      phraseCache = FALLBACK[useMood].slice();
    }
    function nextPhrase() {
      const pool = phraseCache.length ? phraseCache : FALLBACK[mood];
      if (!phraseQueue.length) {
        phraseQueue = shuffleArr(pool);
        if (phraseQueue.length > 1 && phraseQueue[0] === lastPhrase) phraseQueue.push(phraseQueue.shift());
      }
      lastPhrase = phraseQueue.shift();
      return lastPhrase;
    }
    function nextJoke() {
      const pool = chisteCache.length ? chisteCache : CHISTES;
      if (!jokeQueue.length) {
        jokeQueue = shuffleArr(pool);
        if (jokeQueue.length > 1 && jokeQueue[0] === lastJoke) jokeQueue.push(jokeQueue.shift());
      }
      lastJoke = jokeQueue.shift();
      return lastJoke;
    }

    /* ── Crear un pajarito ─────────────────────────────────────── */
    function makeBird(isMain) {
      const b = document.createElement('div');
      b.className = 'colibri' + (isMain ? ' main-bird' : ' pre');
      const w = isMain ? 118 : (78 + Math.random() * 52);
      b.style.width  = w + 'px';
      b.style.height = (w * 0.76) + 'px';
      b.style.top  = (isMain ? 16 : (12 + Math.random() * 48)) + '%';
      b.style.left = (isMain ? 10 : (1 + Math.random() * 10)) + '%';
      b.style.animationDuration = (isMain ? 8 : (22 + Math.random() * 18)) + 's';
      b.style.animationDelay = (-Math.random() * 24) + 's';
      if (!isMain && Math.random() < 0.5) b.style.animationDirection = 'reverse';
      b.innerHTML = (isMain ? '<div class="colibri-hint">hola pajarito</div>' : '') + BIRD_SVG;
      document.body.appendChild(b);
      return b;
    }

    /* ── Pajarito PRINCIPAL (dispara todo) ─────────────────────── */
    const mainBird = makeBird(true);
    mainBird.addEventListener('click', openMain);

    /* Salir de una frase: clic en el espacio vacío (el velo) cierra la revelación */
    document.querySelector('.reveal-veil').addEventListener('click', () => {
      if (document.body.classList.contains('letter-open')) { closeLetter(); return; }
      if (document.body.classList.contains('bird-reveal')) {
        if (document.body.classList.contains('joke-open')) {
          revealPhraseNow();   // aún está el chiste: primero asegura que salga la frase
        } else {
          closeReveal(); hideChooser();   // la frase ya se vio: ahora sí cerrar
        }
      }
    });

    /* ── Cartica por fecha (mensajes configurables en cartas.json) ── */
    let cartas = { mensajeNoDisponible: 'Hoy no puedes ver este mensaje 💌  vuelve otro día…', cartas: [] };
    fetch('cartas.json', { cache: 'no-store' })
      .then(r => r.ok ? r.json() : null)
      .then(d => { if (d) cartas = d; })
      .catch(() => {});
    function todayStr() {
      const d = new Date();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return d.getFullYear() + '-' + mm + '-' + dd;
    }
    const letterCard = document.querySelector('.letter-card');
    let cartaPin = '';   // pin validado al abrir la carta (para enviar mensajes)
    document.getElementById('letter-bird').addEventListener('click', openLetter);

    function openLetter() {
      closeReveal(); hideChooser();   // la música sigue sonando mientras se lee la carta
      letterCard.querySelector('.lc-lock').hidden = false;
      letterCard.querySelector('.lc-content').hidden = true;
      letterCard.querySelector('.lc-pin').value = '';
      letterCard.querySelector('.lc-error').textContent = '';
      letterCard.querySelector('.lc-sent').textContent = '';
      letterCard.querySelector('.lc-reply-text').value = '';
      document.body.classList.add('letter-open');
      setTimeout(() => letterCard.querySelector('.lc-pin').focus(), 300);
    }
    function closeLetter() { document.body.classList.remove('letter-open'); }

    async function unlockLetter() {
      const pinInput = letterCard.querySelector('.lc-pin');
      const err = letterCard.querySelector('.lc-error');
      const pin = (pinInput.value || '').trim();
      err.textContent = 'Abriendo…';
      let data = null;
      try {   // producción: las cartas vienen privadas desde el servidor
        const r = await fetch('/api/carta?pin=' + encodeURIComponent(pin), { cache: 'no-store' });
        if (r.status === 200) { const d = await r.json(); if (d && d.ok) data = d; }
      } catch (_) { /* sin backend: probamos el respaldo local */ }
      if (!data && cartas && cartas.pin && pin === cartas.pin) data = cartas;   // local (cartas.json)
      if (!data) { err.textContent = 'Pin incorrecto… inténtalo otra vez.'; pinInput.value = ''; return; }
      err.textContent = '';
      cartaPin = pin;   // guardamos el pin validado para poder enviar mensajes
      renderCarta(data);
      letterCard.querySelector('.lc-lock').hidden = true;
      letterCard.querySelector('.lc-content').hidden = false;
      letterCard.scrollTop = 0;
    }
    function renderCarta(data) {
      const c = (data.cartas || []).find(x => x.fecha === todayStr());
      const titleEl = letterCard.querySelector('.lc-title');
      const msgEl = letterCard.querySelector('.lc-msg');
      msgEl.innerHTML = '';
      if (c) {
        titleEl.textContent = c.titulo || 'Para ti';
        const parras = (c.parrafos && c.parrafos.length) ? c.parrafos : [(c.mensaje || '')];
        parras.forEach(p => { const el = document.createElement('p'); el.textContent = p; msgEl.appendChild(el); });
      } else {
        titleEl.textContent = '···';
        const el = document.createElement('p');
        el.textContent = data.mensajeNoDisponible || (cartas && cartas.mensajeNoDisponible) || 'Hoy no puedes ver este mensaje.';
        msgEl.appendChild(el);
      }
    }
    letterCard.querySelector('.lc-unlock').addEventListener('click', unlockLetter);
    letterCard.querySelector('.lc-pin').addEventListener('keydown', e => { if (e.key === 'Enter') unlockLetter(); });

    async function enviarMensaje() {
      const ta = letterCard.querySelector('.lc-reply-text');
      const sent = letterCard.querySelector('.lc-sent');
      const msg = (ta.value || '').trim();
      if (!msg) { sent.textContent = 'Escribe algo primero 🙂'; return; }
      sent.textContent = 'Enviando…';
      try {
        const r = await fetch('/api/mensaje', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin: cartaPin, mensaje: msg })
        });
        if (r.ok) { sent.textContent = '¡Enviado! Gracias 💛'; ta.value = ''; }
        else { sent.textContent = 'No se pudo enviar por ahora (falta configurar el guardado).'; }
      } catch (_) { sent.textContent = 'No se pudo enviar (sin conexión al servidor).'; }
    }
    letterCard.querySelector('.lc-send').addEventListener('click', enviarMensaje);

    function openMain() {
      if (currentBird === mainBird && document.body.classList.contains('bird-reveal')) {
        closeReveal(); hideChooser(); return;      // volver a tocar = cerrar (la música sigue)
      }
      if (activeMode) { stopMode(activeMode); activeMode = null; }
      closeReveal();
      currentBird = mainBird;
      mainBird.classList.add('bird-active');
      playBirdSong(randomFrom(MAIN_SONGS));   // canción del principal: aleatoria
      setRevealText(MAIN_PHRASE);
      void document.body.offsetWidth;
      document.body.classList.add('bird-reveal');
      stardustFromBird(mainBird);
      showChooser();
    }

    /* ── Selector de ánimo (dos pollitos) ──────────────────────── */
    const chooser = document.getElementById('mood-chooser');
    function showChooser() { chooser.classList.add('show'); }
    function hideChooser() { chooser.classList.remove('show'); }
    document.querySelectorAll('.egg-btn').forEach(btn => {
      btn.addEventListener('click', () => chooseMood(btn.dataset.mood));
    });
    function chooseMood(m) {
      mood = m;
      playlist = SONGS[m];       // triste = canciones tristes; bien = alegres
      phraseQueue = []; lastPhrase = null;   // reinicia la variedad para el nuevo ánimo
      loadPhrases(m);            // reconfigura las frases según bien/triste
      hideChooser();
      closeReveal();             // desaparece la revelación del principal (la canción sigue)
      setTimeout(spawnFlock, 450); // ...y salen los demás pajaritos
    }

    /* ── Crear una criatura de la bandada (pájaro o mariposa) ──── */
    function makeCreature(kind) {
      const el = document.createElement('div');
      const isB = (kind === 'butterfly');
      el.className = (isB ? 'butterfly' : 'colibri') + ' pre';
      const w = isB ? (60 + Math.random() * 40) : (78 + Math.random() * 52);
      el.style.width  = w + 'px';
      el.style.height = (w * (isB ? 0.78 : 0.76)) + 'px';
      el.style.top  = (12 + Math.random() * 48) + '%';
      el.style.left = (1 + Math.random() * 10) + '%';
      el.style.animationDuration = ((isB ? 16 : 22) + Math.random() * 18) + 's';
      el.style.animationDelay = (-Math.random() * 24) + 's';
      if (Math.random() < 0.5) el.style.animationDirection = 'reverse';
      el.innerHTML = isB ? BUTTERFLY_SVG : BIRD_SVG;
      document.body.appendChild(el);
      return el;
    }

    /* ── Bandada: pájaros si "bien", mariposas si "triste" ─────── */
    function spawnFlock() {
      const kind = (mood === 'bien') ? 'bird' : 'butterfly';
      if (flockSpawned && flockKind !== kind) {   // cambió el ánimo → cambia la especie
        flock.forEach(el => el.remove());
        flock.length = 0;
        flockSpawned = false;
      }
      if (!flockSpawned) {
        flockKind = kind;
        for (let i = 0; i < FLOCK_COUNT; i++) {
          const el = makeCreature(kind);
          el.dataset.song = playlist[i % playlist.length];
          const svg = el.querySelector('svg');
          if (svg) svg.style.filter = BIRD_TINTS[i % BIRD_TINTS.length];  // color propio
          el.addEventListener('click', () => openCreature(el));
          flock.push(el);
        }
        flockSpawned = true;
      }
      flock.forEach((el, i) => setTimeout(() => el.classList.remove('pre'), 300 + i * 220));
    }

    /* ── Abrir una criatura: primero el CHISTE, luego la frase ──── */
    function openCreature(el) {
      if (currentBird === el) { closeReveal(); return; }   // cerrar sin cortar la música
      if (activeMode) { stopMode(activeMode); activeMode = null; }
      closeReveal();
      currentBird = el;
      el.classList.add('bird-active');
      playBirdSong(el.dataset.song);   // respeta el bloqueo de 1 minuto
      setRevealText('');               // la frase llega después del chiste
      void document.body.offsetWidth;
      document.body.classList.add('bird-reveal');
      stardustFromBird(el);
      showJoke();
      loadPhrases();             // refresca frases en segundo plano
    }

    /* ── Chiste con 2 opciones ─────────────────────────────────── */
    function showJoke() {
      const j = nextJoke();   // sin repetir hasta agotar el set
      currentJoke = j;
      const correctFirst = Math.random() < 0.5;
      const values = correctFirst ? [j.correcta, j.falsa] : [j.falsa, j.correcta];
      const correctIndex = correctFirst ? 0 : 1;
      document.querySelector('.joke-q').textContent = j.q;
      document.querySelectorAll('.joke-opt').forEach((b, i) => {
        b.textContent = values[i];
        b.className = 'joke-opt';
        b.dataset.correct = (i === correctIndex) ? '1' : '0';
        b.disabled = false;
      });
      const res = document.querySelector('.joke-result');
      res.className = 'joke-result'; res.innerHTML = '';
      document.body.classList.add('joke-open');
      loadChistes();             // refresca chistes en segundo plano
    }
    document.querySelectorAll('.joke-opt').forEach(b => {
      b.addEventListener('click', () => answerJoke(b));
    });
    function answerJoke(btn) {
      const opts = document.querySelectorAll('.joke-opt');
      opts.forEach(b => b.disabled = true);
      const correct = btn.dataset.correct === '1';
      opts.forEach(b => { if (b.dataset.correct === '1') b.classList.add('ok'); });
      if (!correct) btn.classList.add('no');
      const res = document.querySelector('.joke-result');
      res.innerHTML = (correct ? 'uff, eres buena 😌' : 'nahh, perdiste 🙈') + '<small>— mis chistes malos</small>';
      res.classList.add('show');
      clearTimeout(jokeTimer);
      jokeTimer = setTimeout(revealPhraseNow, 2300);   // tras un momento, sale la frase sola
    }

    function revealPhraseNow() {   // asegura que la frase se muestre (por tiempo o por click)
      if (!document.body.classList.contains('bird-reveal')) return; // ya se cerró todo
      clearTimeout(jokeTimer);
      document.body.classList.remove('joke-open');
      setRevealText(nextPhrase());   // la frase según el ánimo
    }

    function setRevealText(txt) {
      const el = document.querySelector('.reveal-text .rt-main');
      if (!el) return;
      el.classList.remove('show');
      el.textContent = txt;
      if (txt) { void el.offsetWidth; el.classList.add('show'); }
    }

    /* ── Motor de audio con bloqueo de 1 minuto + auto-avance ──── */
    function randomFrom(list) { return list[Math.floor(Math.random() * list.length)]; }

    function playBirdSong(src) {
      // Música ESTABLE: si ya hay algo sonando, NO se cambia (solo cambia el chiste/frase).
      // La canción solo avanza sola cuando termina, o arranca si no hay nada sonando.
      if (currentBirdAudio && !currentBirdAudio.paused) return;
      startSong(src);
    }
    function startSong(src) {
      if (currentBirdAudio) { currentBirdAudio.onended = null; currentBirdAudio.pause(); currentBirdAudio = null; }
      const idx = playlist.indexOf(src);
      if (idx >= 0) playlistIndex = idx;
      currentBirdAudio = new Audio(src);
      currentBirdAudio.volume = 0.6;
      currentBirdAudio.loop = false;   // al terminar, avanza sola a la siguiente
      currentBirdAudio.onended = () => {
        playlistIndex = (playlistIndex + 1) % playlist.length;
        startSong(playlist[playlistIndex]);
      };
      currentBirdAudio.play().catch(() => {});
      songLockUntil = Date.now() + SONG_LOCK_MS;
    }
    function stopBirdSong() {
      if (currentBirdAudio) { currentBirdAudio.onended = null; currentBirdAudio.pause(); currentBirdAudio = null; }
      songLockUntil = 0;
    }

    loadPhrases();               // precarga inicial (ánimo por defecto)
    loadChistes();               // precarga chistes
    fetch('/api/visita', { method: 'POST', cache: 'no-store' }).catch(function () {}); // registra la visita

    function closeReveal() {     // cierra solo la revelación visual (la canción sigue)
      clearTimeout(jokeTimer);   // evita que un chiste viejo pise la nueva revelación
      if (currentBird) { currentBird.classList.remove('bird-active'); currentBird = null; }
      document.body.classList.remove('bird-reveal');
      document.body.classList.remove('joke-open');
      const rt = document.querySelector('.reveal-text .rt-main');
      if (rt) rt.classList.remove('show');
    }
    function closeBird() {       // cierre total: visual + audio
      closeReveal();
      stopBirdSong();
    }

    function stardustFromBird(el) {
      const r  = el.getBoundingClientRect();
      const ox = r.left + r.width / 2;
      const oy = r.top + r.height / 2;
      const tints = ['#ffffff', '#dfeaff', '#b9d4ff', '#fff2c8'];
      for (let i = 0; i < 32; i++) {
        const d  = document.createElement('div');
        d.className = 'stardust';
        const sz = 2 + Math.random() * 4;
        const c  = tints[Math.floor(Math.random() * tints.length)];
        d.style.left = ox + 'px';
        d.style.top  = oy + 'px';
        d.style.width  = sz + 'px';
        d.style.height = sz + 'px';
        d.style.background = c;
        d.style.boxShadow  = '0 0 ' + (sz * 2.6) + 'px ' + c;
        document.body.appendChild(d);
        const ang  = Math.random() * Math.PI * 2;
        const dist = 40 + Math.random() * 190;
        const dx = Math.cos(ang) * dist;
        const dy = Math.sin(ang) * dist + 40;   /* deriva hacia abajo: melancolía */
        d.animate([
          { transform: 'translate(-50%,-50%) scale(1)',   opacity: 0.9 },
          { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0.2)`, opacity: 0 }
        ], { duration: 2600 + Math.random() * 2200, easing: 'ease-out' }).onfinish = () => d.remove();
      }
    }
  </script>
</body>
</html>
