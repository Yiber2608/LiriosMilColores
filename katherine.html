<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Para Katherine ✦</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Italianno&family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    :root {
      --night-deep: #04060f;
      --tulip-yellow-deep: #c98a05;
      --tulip-yellow: #f5c518;
      --tulip-yellow-light: #ffe066;
      --tulip-yellow-bright: #fff4a8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--night-deep);
      font-family: 'Cormorant Garamond', serif;
      color: #e8e4d0;
      cursor: default;
    }

    /* ===== Cielo nocturno ===== */
    .sky {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 10%, rgba(74, 95, 156, 0.25) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(120, 80, 160, 0.18) 0%, transparent 55%),
        radial-gradient(ellipse at 50% 100%, rgba(20, 58, 35, 0.4) 0%, transparent 60%),
        linear-gradient(180deg, #02030a 0%, #060c1f 35%, #0a1535 65%, #0d1f3d 100%);
      z-index: 0;
    }

    .milky-way {
      position: fixed;
      top: -10%; left: -10%;
      width: 120%; height: 60%;
      background:
        radial-gradient(ellipse 60% 25% at 50% 50%, rgba(180, 200, 255, 0.08) 0%, transparent 70%),
        radial-gradient(ellipse 40% 15% at 45% 55%, rgba(220, 180, 255, 0.05) 0%, transparent 60%);
      transform: rotate(-15deg);
      filter: blur(20px);
      z-index: 1;
      pointer-events: none;
    }

    #particles-canvas {
      position: fixed; inset: 0; z-index: 2; pointer-events: none;
    }

    /* Luna */
    .moon {
      position: fixed;
      top: 8%; right: 12%;
      width: 110px; height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fffaf0 0%, #f5ecd5 40%, #d4c89a 80%, #aa9967 100%);
      box-shadow:
        0 0 40px rgba(255, 245, 200, 0.4),
        0 0 80px rgba(255, 245, 200, 0.25),
        0 0 140px rgba(255, 245, 200, 0.15),
        inset -15px -15px 40px rgba(80, 60, 30, 0.3);
      z-index: 3;
      animation: moonPulse 8s ease-in-out infinite;
    }
    .moon::before {
      content: '';
      position: absolute;
      inset: -30px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 245, 200, 0.15), transparent 70%);
      z-index: -1;
    }
    .moon::after {
      content: '';
      position: absolute;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: rgba(140, 120, 80, 0.25);
      top: 30%; left: 25%;
      box-shadow:
        25px 35px 0 -3px rgba(140, 120, 80, 0.18),
        -8px 45px 0 -6px rgba(140, 120, 80, 0.2),
        40px 15px 0 -8px rgba(140, 120, 80, 0.15);
    }
    @keyframes moonPulse {
      0%, 100% { box-shadow: 0 0 40px rgba(255, 245, 200, 0.4), 0 0 80px rgba(255, 245, 200, 0.25), 0 0 140px rgba(255, 245, 200, 0.15), inset -15px -15px 40px rgba(80, 60, 30, 0.3); }
      50% { box-shadow: 0 0 60px rgba(255, 245, 200, 0.55), 0 0 120px rgba(255, 245, 200, 0.35), 0 0 180px rgba(255, 245, 200, 0.2), inset -15px -15px 40px rgba(80, 60, 30, 0.3); }
    }

    /* Estrellas */
    .stars-static { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle var(--dur, 3s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
    }
    .star.bright { box-shadow: 0 0 6px rgba(255,255,255,0.9), 0 0 12px rgba(180, 200, 255, 0.5); }
    @keyframes twinkle {
      0%, 100% { opacity: var(--max, 1); transform: scale(1); }
      50% { opacity: 0.2; transform: scale(0.6); }
    }

    .shooting-star {
      position: fixed;
      width: 2px; height: 2px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 0 6px white;
      z-index: 3;
      pointer-events: none;
    }

    /* ===== Suelo / tierra ===== */
    .ground {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 28vh;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(45, 138, 82, 0.18) 0%, transparent 70%),
        linear-gradient(180deg, transparent 0%, rgba(15, 53, 32, 0.4) 30%, rgba(8, 30, 18, 0.85) 70%, rgba(20, 12, 6, 0.95) 100%);
      z-index: 4;
      pointer-events: none;
    }

    .soil-mound {
      position: fixed;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 70%;
      max-width: 900px;
      height: 90px;
      background: radial-gradient(ellipse at 50% 100%, #2a1810 0%, #1a0e08 40%, transparent 70%);
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
      z-index: 6;
      pointer-events: none;
      filter: blur(2px);
    }

    .grass-blade {
      position: fixed;
      bottom: 0;
      width: 3px;
      background: linear-gradient(to top, #0a2614 0%, #1d5a37 60%, #2d8a52 100%);
      border-radius: 50% 50% 0 0;
      z-index: 7;
      transform-origin: bottom center;
      animation: grassSway 3s ease-in-out infinite;
    }
    @keyframes grassSway {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }

    .mist {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 30vh;
      background: radial-gradient(ellipse at 50% 100%, rgba(140, 180, 200, 0.12) 0%, transparent 60%);
      z-index: 8;
      pointer-events: none;
      animation: mistDrift 20s ease-in-out infinite alternate;
    }
    @keyframes mistDrift {
      from { transform: translateX(-30px); opacity: 0.7; }
      to { transform: translateX(30px); opacity: 1; }
    }

    /* ===== Tulipanes con animación de brote ===== */
    .tulips-stage {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 80vh;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 40px;
      z-index: 10;
      pointer-events: none;
    }

    .tulip {
      position: relative;
      width: 240px;
      height: 75vh;
      transform-origin: bottom center;
      transform: scaleY(0.02) scaleX(0.3);
      opacity: 0;
      animation: bloom 4.5s cubic-bezier(0.34, 1.2, 0.64, 1) forwards;
    }
    .tulip.t1 { animation-delay: 0.3s; }
    .tulip.t2 { animation-delay: 0.8s; z-index: 11; }
    .tulip.t3 { animation-delay: 1.3s; }

    /* Brote: crece desde abajo hacia arriba */
    @keyframes bloom {
      0% {
        transform: scaleY(0.02) scaleX(0.3);
        opacity: 0;
      }
      8% {
        opacity: 1;
      }
      40% {
        transform: scaleY(0.45) scaleX(0.85);
      }
      75% {
        transform: scaleY(0.95) scaleX(1.02);
      }
      90% {
        transform: scaleY(1.02) scaleX(0.98);
      }
      100% {
        transform: scaleY(1) scaleX(1);
        opacity: 1;
      }
    }

    /* Sway sutil después del brote */
    .tulip-inner {
      width: 100%;
      height: 100%;
      transform-origin: bottom center;
      animation: sway 6s ease-in-out infinite;
      animation-delay: 5s;
    }
    @keyframes sway {
      0%, 100% { transform: rotate(-1.5deg); }
      50% { transform: rotate(1.5deg); }
    }

    .tulip svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 10px 25px rgba(0,0,0,0.6));
    }

    /* Resplandor en la base cuando brota */
    .sprout-glow {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 30px;
      background: radial-gradient(ellipse, rgba(255, 220, 100, 0.6) 0%, transparent 70%);
      border-radius: 50%;
      filter: blur(8px);
      opacity: 0;
      animation: sproutGlow 4s ease-out forwards;
    }
    .tulip.t1 .sprout-glow { animation-delay: 0.3s; }
    .tulip.t2 .sprout-glow { animation-delay: 0.8s; }
    .tulip.t3 .sprout-glow { animation-delay: 1.3s; }
    @keyframes sproutGlow {
      0% { opacity: 0; transform: translateX(-50%) scale(0.3); }
      30% { opacity: 1; transform: translateX(-50%) scale(1.2); }
      100% { opacity: 0; transform: translateX(-50%) scale(2); }
    }

    @keyframes fadeInSig { to { opacity: 1; } }

    .hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      color: rgba(232, 228, 208, 0.35);
      text-transform: uppercase;
      z-index: 25;
      animation: hintPulse 3s ease-in-out infinite, fadeInSig 3s ease-out 6.5s forwards;
      opacity: 0;
      pointer-events: none;
    }
    @keyframes hintPulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.8; }
    }

    /* ===== LETRAS OCULTAS EN LAS HOJAS ===== */
    .leaf-letter {
      font-family: 'Great Vibes', 'Italianno', cursive;
      fill: rgba(255, 244, 168, 0.55);
      font-weight: 400;
      opacity: 0;
      animation: letterAppear 2s ease-out forwards;
      paint-order: stroke fill;
      stroke: rgba(20, 60, 30, 0.4);
      stroke-width: 0.5;
    }
    @keyframes letterAppear {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    /* Delays para que aparezcan en orden K-A-T-H-E-R-I-N-E después del brote */
    .l-K { animation-delay: 5.5s; }
    .l-A { animation-delay: 5.8s; }
    .l-T { animation-delay: 6.1s; }
    .l-H { animation-delay: 6.4s; }
    .l-E1 { animation-delay: 6.7s; }
    .l-R { animation-delay: 7.0s; }
    .l-I { animation-delay: 7.3s; }
    .l-N { animation-delay: 7.6s; }
    .l-E2 { animation-delay: 7.9s; }

    /* Luciérnagas */
    .firefly {
      position: fixed;
      width: 4px; height: 4px;
      background: #fff4a8;
      border-radius: 50%;
      box-shadow: 0 0 8px #fff4a8, 0 0 16px rgba(255, 220, 100, 0.6), 0 0 30px rgba(255, 200, 80, 0.4);
      z-index: 15;
      pointer-events: none;
      opacity: 0;
      animation: fireflyFloat var(--fdur, 12s) ease-in-out infinite, fireflyBlink 2s ease-in-out infinite, fadeInSig 2s ease-out 7s forwards;
    }
    @keyframes fireflyFloat {
      0%   { transform: translate(0, 0); }
      25%  { transform: translate(40px, -60px); }
      50%  { transform: translate(-30px, -100px); }
      75%  { transform: translate(50px, -50px); }
      100% { transform: translate(0, 0); }
    }
    @keyframes fireflyBlink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    /* ===== Lirios del suelo ===== */
    #lilies-container {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 32vh;
      z-index: 5;
      pointer-events: none;
      overflow: hidden;
    }
    @keyframes lilyAppear {
      from { opacity: 0; transform: scale(0.1); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* ===== Tulipanes interactivos ===== */
    .tulip { cursor: pointer; pointer-events: auto; }
    .tulip svg { transition: filter 0.4s ease; }
    .tulip:hover svg {
      filter: drop-shadow(0 0 18px rgba(255,220,100,0.55)) drop-shadow(0 10px 25px rgba(0,0,0,0.6));
    }
    .tulip.active svg {
      filter: drop-shadow(0 0 34px rgba(255,210,60,0.9)) drop-shadow(0 10px 25px rgba(0,0,0,0.6));
    }

    /* ===== Modo día ===== */
    .day-sky {
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg,
        #0a3d7a 0%, #1565c0 15%, #1e88e5 30%,
        #42a5f5 50%, #90caf9 70%,
        #c5e8f0 88%, #e8f5e9 100%);
      z-index: 0;
      opacity: 0;
      transition: opacity 3s ease;
      pointer-events: none;
    }
    body.day-mode .day-sky     { opacity: 1; }
    body.day-mode .milky-way   { opacity: 0; transition: opacity 2s ease; }
    body.day-mode .stars-static { opacity: 0; transition: opacity 2s ease; }
    body.day-mode .moon        { opacity: 0 !important; transition: opacity 2s ease; }
    body.day-mode .ground {
      background:
        radial-gradient(ellipse at 50% 0%, rgba(80,200,100,0.3) 0%, transparent 70%),
        linear-gradient(180deg, transparent 0%, rgba(50,140,60,0.55) 30%, rgba(30,100,40,0.85) 70%, rgba(15,60,20,0.95) 100%);
      transition: background 3s ease;
    }

    .sun {
      position: fixed;
      top: 8%; right: 12%;
      width: 110px; height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fffde7 0%, #fff176 30%, #ffca28 60%, #ff8f00 100%);
      box-shadow:
        0 0 0 22px rgba(255,220,50,0.12),
        0 0 0 44px rgba(255,200,0,0.08),
        0 0 0 72px rgba(255,180,0,0.05),
        0 0 65px  rgba(255,230,50,0.8),
        0 0 130px rgba(255,180,0,0.5),
        0 0 220px rgba(255,120,0,0.25);
      z-index: 3;
      opacity: 0;
      transition: opacity 2.5s ease;
      pointer-events: none;
      animation: sunPulse 7s ease-in-out infinite;
    }
    body.day-mode .sun { opacity: 1; }
    @keyframes sunPulse {
      0%,100% { transform: scale(1); }
      50%     { transform: scale(1.05); }
    }

    /* ===== Lluvia ===== */
    #rain-canvas {
      position: fixed;
      inset: 0;
      z-index: 9;
      pointer-events: none;
      display: none;
    }

    @media (max-width: 768px) {
      .tulips-stage { gap: 5px; }
      .tulip { width: 130px; }
      .moon { width: 70px; height: 70px; top: 5%; right: 8%; }
    }
  </style>
</head>
<body>
  <div class="sky"></div>
  <div class="day-sky"></div>
  <div class="milky-way"></div>

  <div class="moon"></div>
  <div class="sun"></div>

  <div class="stars-static" id="stars"></div>

  <canvas id="particles-canvas"></canvas>
  <canvas id="rain-canvas"></canvas>

  <div class="ground"></div>
  <div class="soil-mound"></div>
  <div id="grass-container"></div>
  <div class="mist"></div>

  <!-- Tulipanes -->
  <div class="tulips-stage">

    <!-- ============ TULIPÁN 1 (Izquierda) – letras: K, A, T ============ -->
    <div class="tulip t1">
      <div class="sprout-glow"></div>
      <div class="tulip-inner">
      <svg viewBox="0 0 240 700" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax meet">
        <defs>
          <linearGradient id="petal1" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#fff4a8"/>
            <stop offset="35%" stop-color="#ffe066"/>
            <stop offset="70%" stop-color="#f5c518"/>
            <stop offset="100%" stop-color="#c98a05"/>
          </linearGradient>
          <linearGradient id="petalShadow1" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#a87405" stop-opacity="0.7"/>
            <stop offset="50%" stop-color="#d49c0a" stop-opacity="0.2"/>
            <stop offset="100%" stop-color="#a87405" stop-opacity="0.7"/>
          </linearGradient>
          <radialGradient id="petalHighlight1" cx="50%" cy="30%" r="60%">
            <stop offset="0%" stop-color="#fffae0" stop-opacity="0.85"/>
            <stop offset="60%" stop-color="#fff4a8" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="stem1" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#0a2614"/>
            <stop offset="35%" stop-color="#1d5a37"/>
            <stop offset="65%" stop-color="#2a6840"/>
            <stop offset="100%" stop-color="#0a2614"/>
          </linearGradient>
          <linearGradient id="leaf1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2d8a52"/>
            <stop offset="50%" stop-color="#1d5a37"/>
            <stop offset="100%" stop-color="#0a2614"/>
          </linearGradient>
          <linearGradient id="leaf1b" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#3aa462"/>
            <stop offset="60%" stop-color="#1d5a37"/>
            <stop offset="100%" stop-color="#0a2614"/>
          </linearGradient>
          <filter id="softShadow1"><feGaussianBlur stdDeviation="4"/></filter>
        </defs>

        <!-- TALLO -->
        <path d="M 120 700 Q 115 500, 118 350 Q 122 220, 120 130"
              stroke="url(#stem1)" stroke-width="9" fill="none" stroke-linecap="round"/>
        <path d="M 120 700 Q 115 500, 118 350 Q 122 220, 120 130"
              stroke="#3a7a4f" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"
              transform="translate(-2, 0)"/>

        <!-- HOJA GRANDE INFERIOR IZQUIERDA con K -->
        <g>
          <path d="M 118 480
                   Q 50 450, 18 380
                   Q 0 320, 28 270
                   Q 60 315, 90 380
                   Q 112 430, 118 480 Z"
                fill="url(#leaf1)" stroke="#0a2614" stroke-width="1.5"/>
          <path d="M 118 480 Q 88 420, 55 350 Q 38 305, 28 270"
                stroke="#0a2614" stroke-width="1.2" fill="none" opacity="0.6"/>
          <path d="M 100 450 Q 78 432, 58 412 M 88 410 Q 68 395, 48 380 M 78 370 Q 58 360, 40 345"
                stroke="#0a2614" stroke-width="0.6" fill="none" opacity="0.4"/>
          <text class="leaf-letter l-K" x="52" y="390" transform="rotate(-22 52 390)" font-size="38">K</text>
        </g>

        <!-- HOJA MEDIANA DERECHA con A -->
        <g>
          <path d="M 120 380
                   Q 175 360, 210 305
                   Q 225 265, 208 220
                   Q 175 260, 148 305
                   Q 125 345, 120 380 Z"
                fill="url(#leaf1b)" stroke="#0a2614" stroke-width="1.5"/>
          <path d="M 120 380 Q 152 340, 185 285 Q 200 255, 208 220"
                stroke="#0a2614" stroke-width="1" fill="none" opacity="0.55"/>
          <path d="M 138 350 Q 158 333, 180 318 M 148 320 Q 168 308, 188 295"
                stroke="#0a2614" stroke-width="0.5" fill="none" opacity="0.35"/>
          <text class="leaf-letter l-A" x="160" y="295" transform="rotate(32 160 295)" font-size="36">A</text>
        </g>

        <!-- HOJA PEQUEÑA IZQUIERDA SUPERIOR con T -->
        <g>
          <path d="M 120 250
                   Q 75 235, 50 195
                   Q 38 165, 55 140
                   Q 80 175, 98 215
                   Q 115 240, 120 250 Z"
                fill="url(#leaf1)" stroke="#0a2614" stroke-width="1.2"/>
          <path d="M 120 250 Q 88 215, 65 175 Q 55 158, 55 140"
                stroke="#0a2614" stroke-width="0.8" fill="none" opacity="0.5"/>
          <text class="leaf-letter l-T" x="63" y="198" transform="rotate(-18 63 198)" font-size="34">T</text>
        </g>

        <!-- ============ FLOR ============ -->
        <g transform="translate(120, 130)">
          <ellipse cx="0" cy="5" rx="42" ry="8" fill="#000" opacity="0.25" filter="url(#softShadow1)"/>

          <path d="M -38 0 C -50 -25, -55 -65, -45 -100 C -38 -125, -22 -135, -5 -130 C -8 -90, -12 -45, -10 0 Z"
                fill="url(#petal1)" stroke="#a87405" stroke-width="0.8" opacity="0.92"/>
          <path d="M -38 0 C -50 -25, -55 -65, -45 -100"
                stroke="url(#petalShadow1)" stroke-width="2" fill="none" opacity="0.6"/>

          <path d="M 38 0 C 50 -25, 55 -65, 45 -100 C 38 -125, 22 -135, 5 -130 C 8 -90, 12 -45, 10 0 Z"
                fill="url(#petal1)" stroke="#a87405" stroke-width="0.8" opacity="0.92"/>
          <path d="M 38 0 C 50 -25, 55 -65, 45 -100"
                stroke="url(#petalShadow1)" stroke-width="2" fill="none" opacity="0.6"/>

          <path d="M -32 5 C -42 -20, -42 -70, -32 -110 C -22 -135, -8 -138, 0 -135 C 0 -90, -5 -40, -8 5 Z"
                fill="url(#petal1)" stroke="#c98a05" stroke-width="1"/>
          <path d="M -25 -10 C -32 -50, -30 -90, -20 -120"
                stroke="#a87405" stroke-width="1.5" fill="none" opacity="0.45"/>
          <ellipse cx="-18" cy="-70" rx="8" ry="35" fill="url(#petalHighlight1)" opacity="0.7"/>

          <path d="M 32 5 C 42 -20, 42 -70, 32 -110 C 22 -135, 8 -138, 0 -135 C 0 -90, 5 -40, 8 5 Z"
                fill="url(#petal1)" stroke="#c98a05" stroke-width="1"/>
          <path d="M 25 -10 C 32 -50, 30 -90, 20 -120"
                stroke="#a87405" stroke-width="1.5" fill="none" opacity="0.45"/>
          <ellipse cx="18" cy="-70" rx="8" ry="35" fill="url(#petalHighlight1)" opacity="0.7"/>

          <path d="M 0 5 C 0 -40, 0 -90, 0 -135"
                stroke="#a87405" stroke-width="0.8" fill="none" opacity="0.5"/>

          <ellipse cx="-15" cy="-100" rx="3" ry="6" fill="#fffae0" opacity="0.85"/>
          <ellipse cx="20" cy="-80" rx="2" ry="5" fill="#fffae0" opacity="0.7"/>
          <ellipse cx="-30" cy="-50" rx="2" ry="4" fill="#fffae0" opacity="0.6"/>
        </g>
      </svg>
      </div>
    </div>

    <!-- ============ TULIPÁN 2 (Centro) – letras: H, E, R ============ -->
    <div class="tulip t2">
      <div class="sprout-glow"></div>
      <div class="tulip-inner">
      <svg viewBox="0 0 240 700" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax meet">
        <defs>

  <script>
    (function generateStars() {
      const container = document.getElementById('stars');
      const count = 180;
      for (let i = 0; i < count; i++) {
        const star = document.createElement('div');
        star.className = 'star' + (Math.random() > 0.85 ? ' bright' : '');
        const size = Math.random() * 2.5 + 0.5;
        star.style.width = size + 'px';
        star.style.height = size + 'px';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 75 + '%';
        star.style.setProperty('--dur', (Math.random() * 4 + 2) + 's');
        star.style.setProperty('--delay', (Math.random() * 5) + 's');
        star.style.setProperty('--max', (Math.random() * 0.6 + 0.4));
        container.appendChild(star);
      }
    })();

    (function generateGrass() {
      const container = document.getElementById('grass-container');
      const count = 60;
      for (let i = 0; i < count; i++) {
        const blade = document.createElement('div');
        blade.className = 'grass-blade';
        const height = 8 + Math.random() * 18;
        blade.style.height = height + 'px';
        blade.style.left = Math.random() * 100 + '%';
        blade.style.animationDelay = (Math.random() * 3) + 's';
        blade.style.animationDuration = (2 + Math.random() * 2) + 's';
        container.appendChild(blade);
      }
    })();

    function createShootingStar() {
      const star = document.createElement('div');
      star.className = 'shooting-star';
      const startX = Math.random() * window.innerWidth;
      const startY = Math.random() * (window.innerHeight * 0.4);
      const angle = -25 + Math.random() * 20;
      const distance = 400 + Math.random() * 300;

      star.style.left = startX + 'px';
      star.style.top = startY + 'px';
      document.body.appendChild(star);

      const endX = startX + Math.cos(angle * Math.PI / 180) * distance;
      const endY = startY + Math.sin(angle * Math.PI / 180) * distance + 200;

      star.animate([
        { transform: `translate(0, 0)`, opacity: 0 },
        { opacity: 1, offset: 0.1 },
        { opacity: 1, offset: 0.7 },
        { transform: `translate(${endX - startX}px, ${endY - startY}px)`, opacity: 0 }
      ], {
        duration: 1500 + Math.random() * 1000,
        easing: 'cubic-bezier(0.4, 0, 0.6, 1)'
      }).onfinish = () => star.remove();
    }
    setInterval(createShootingStar, 4500);
    setTimeout(createShootingStar, 1500);

    (function createGroundLilies() {
      const container = document.getElementById('lilies-container');
      const ns = 'http://www.w3.org/2000/svg';
      const palettes = [
        ['#ff69b4','#ff1493','#ffb6c1'],
        ['#4169e1','#6495ed','#87ceeb'],
        ['#dc143c','#e63946','#ff4500'],
        ['#9370db','#da70d6','#ba55d3'],
        ['#ff6347','#ffa07a','#ff8c69'],
        ['#ffffff','#ffe4e1','#fff0f5'],
      ];
      const allColors = palettes.flat();

      for (let i = 0; i < 110; i++) {
        const x    = Math.random() * 100;
        const y    = Math.random() * 85 + 3;
        const size = 5 + Math.random() * 11;
        const color = allColors[Math.floor(Math.random() * allColors.length)];
        const numP  = 5 + Math.floor(Math.random() * 2);
        const rot   = Math.random() * 360;
        const delay = 7 + Math.random() * 4;
        const hl    = size * 0.58;
        const pw    = size * 0.26;
        const vs    = size * 2.6;

        const wrap = document.createElement('div');
        wrap.style.cssText =
          `position:absolute;left:${x}%;bottom:${y}%;` +
          `transform:translate(-50%,50%);width:${vs}px;height:${vs}px;`;

        const svg = document.createElementNS(ns, 'svg');
        svg.setAttribute('width', vs);
        svg.setAttribute('height', vs);
        svg.setAttribute('viewBox', `${-vs/2} ${-vs/2} ${vs} ${vs}`);
        svg.style.cssText =
          `display:block;overflow:visible;` +
          `animation:lilyAppear 1.2s ease-out ${delay}s both;`;

        const g = document.createElementNS(ns, 'g');
        g.setAttribute('transform', `rotate(${rot})`);

        for (let p = 0; p < numP; p++) {
          const ang = (p / numP) * 360;
          const pg = document.createElementNS(ns, 'g');
          pg.setAttribute('transform', `rotate(${ang})`);
          const petal = document.createElementNS(ns, 'ellipse');
          petal.setAttribute('cx', '0');
          petal.setAttribute('cy', -hl);
          petal.setAttribute('rx', pw);
          petal.setAttribute('ry', hl);
          petal.setAttribute('fill', color);
          petal.setAttribute('data-orig', color);
          petal.setAttribute('opacity', '0.9');
          petal.classList.add('lily-petal');
          pg.appendChild(petal);
          g.appendChild(pg);
        }

        /* Estambres visibles desde el interior */
        const stamenCount = numP;
        for (let s = 0; s < stamenCount; s++) {
          const ang = (s / stamenCount) * 360 + 180 / stamenCount;
          const sg = document.createElementNS(ns, 'g');
          sg.setAttribute('transform', `rotate(${ang})`);
          const stamen = document.createElementNS(ns, 'line');
          stamen.setAttribute('x1', '0'); stamen.setAttribute('y1', '0');
          stamen.setAttribute('x2', '0'); stamen.setAttribute('y2', -(hl * 0.55));
          stamen.setAttribute('stroke', '#ffd700');
          stamen.setAttribute('stroke-width', pw * 0.35);
          stamen.setAttribute('stroke-linecap', 'round');
          const tip = document.createElementNS(ns, 'circle');
          tip.setAttribute('cx', '0'); tip.setAttribute('cy', -(hl * 0.55));
          tip.setAttribute('r', pw * 0.45); tip.setAttribute('fill', '#fff176');
          sg.appendChild(stamen); sg.appendChild(tip);
          g.appendChild(sg);
        }

        const center = document.createElementNS(ns, 'circle');
        center.setAttribute('cx', '0'); center.setAttribute('cy', '0');
        center.setAttribute('r', size * 0.28); center.setAttribute('fill', '#fff9c4');
        const dot = document.createElementNS(ns, 'circle');
        dot.setAttribute('cx', '0'); dot.setAttribute('cy', '0');
        dot.setAttribute('r', size * 0.13); dot.setAttribute('fill', '#ffca28');

        g.appendChild(center);
        g.appendChild(dot);
        svg.appendChild(g);
        wrap.appendChild(svg);
        container.appendChild(wrap);
      }
    })();

    (function createFireflies() {
      const count = 12;
      for (let i = 0; i < count; i++) {
        const f = document.createElement('div');
        f.className = 'firefly';
        f.style.left = (15 + Math.random() * 70) + '%';
        f.style.bottom = (10 + Math.random() * 50) + '%';
        f.style.setProperty('--fdur', (8 + Math.random() * 8) + 's');
        f.style.animationDelay = (Math.random() * 5) + 's, ' + (Math.random() * 2) + 's, ' + (7 + Math.random()) + 's';
        document.body.appendChild(f);
      }
    })();

        size: { value: { min: 0.5, max: 1.8 }, animation: { enable: true, speed: 1.5, minimumValue: 0.3, sync: false } },
        move: { enable: true, speed: 0.25, direction: "none", random: true, straight: false, outModes: { default: "out" } },
        links: { enable: true, distance: 130, color: "#7a8db0", opacity: 0.12, width: 0.6 }
      },
      interactivity: {
        events: { onHover: { enable: true, mode: "grab" }, onClick: { enable: true, mode: "push" }, resize: true },
        modes: { grab: { distance: 160, links: { opacity: 0.4 } }, push: { quantity: 3 } }
      },
      detectRetina: true
    });

  <script>
    /* ============================================================
       AUDIO
    ============================================================ */
    const songs = {
      t1: new Audio('until-i-found-you.mp3'),
      t2: new Audio('ufio-oblivion.mp3'),
      t3: new Audio('beethoven-fr-elise.mp3')
    };
    Object.values(songs).forEach(a => { a.loop = true; a.volume = 0.55; });

    let activeMode = null;

    function setMode(mode) {
      if (activeMode === mode) {
        stopMode(activeMode);
        activeMode = null;
        return;
      }
      if (activeMode) stopMode(activeMode);
      activeMode = mode;
      songs[mode].currentTime = 0;
      songs[mode].play().catch(() => {});
      document.querySelector('.tulip.' + mode).classList.add('active');
      if (mode === 't1') enableDay();
      if (mode === 't2') enableRain();
      if (mode === 't3') enableCrazyLilies();
    }

    function stopMode(mode) {
      songs[mode].pause();
      songs[mode].currentTime = 0;
      document.querySelector('.tulip.' + mode).classList.remove('active');
      if (mode === 't1') disableDay();
      if (mode === 't2') disableRain();
      if (mode === 't3') disableCrazyLilies();
    }

    document.querySelector('.tulip.t1').addEventListener('click', () => setMode('t1'));
    document.querySelector('.tulip.t2').addEventListener('click', () => setMode('t2'));
    document.querySelector('.tulip.t3').addEventListener('click', () => setMode('t3'));

    /* ============================================================
       TULIPÁN 1 — MODO DÍA
    ============================================================ */
    function enableDay()  { document.body.classList.add('day-mode'); }
    function disableDay() { document.body.classList.remove('day-mode'); }

    /* ============================================================
       TULIPÁN 2 — LLUVIA
    ============================================================ */
    const rainCanvas = document.getElementById('rain-canvas');
    const rainCtx    = rainCanvas.getContext('2d');
    let rainDrops = [], rainId = null;

    function enableRain() {
      rainCanvas.width  = window.innerWidth;
      rainCanvas.height = window.innerHeight;
      rainCanvas.style.display = 'block';
      rainDrops = Array.from({ length: 260 }, () => ({
        x:  Math.random() * rainCanvas.width,
        y:  Math.random() * rainCanvas.height,
        len:   12 + Math.random() * 18,
        speed:  9 + Math.random() * 10,
        op:   0.25 + Math.random() * 0.45,
        w:    0.8 + Math.random() * 0.8
      }));
      animateRain();
    }

    function animateRain() {
      rainCtx.clearRect(0, 0, rainCanvas.width, rainCanvas.height);
      rainDrops.forEach(d => {
        rainCtx.beginPath();
        rainCtx.moveTo(d.x, d.y);
        rainCtx.lineTo(d.x - 3, d.y + d.len);
        rainCtx.strokeStyle = `rgba(180, 220, 245, ${d.op})`;
        rainCtx.lineWidth = d.w;
        rainCtx.stroke();
        d.y += d.speed;
        if (d.y > rainCanvas.height) { d.y = -d.len; d.x = Math.random() * rainCanvas.width; }
      });
      rainId = requestAnimationFrame(animateRain);
    }

    function disableRain() {
      cancelAnimationFrame(rainId);
      rainId = null;
      rainCtx.clearRect(0, 0, rainCanvas.width, rainCanvas.height);
      rainCanvas.style.display = 'none';
    }

    window.addEventListener('resize', () => {
      if (rainId) { rainCanvas.width = window.innerWidth; rainCanvas.height = window.innerHeight; }
    });

    /* ============================================================
       TULIPÁN 3 — LIRIOS LOCOS
    ============================================================ */
    const crazyColors = [
      '#ff1493','#ff69b4','#ff4500','#ffd700','#00e5ff',
      '#7c4dff','#76ff03','#ff6d00','#ea80fc','#18ffff',
      '#ff3d00','#69f0ae','#40c4ff','#e040fb','#ffff00'
    ];
    let lilyInterval = null;

    function enableCrazyLilies() {
      lilyInterval = setInterval(() => {
        document.querySelectorAll('.lily-petal').forEach(p => {
          p.setAttribute('fill', crazyColors[Math.floor(Math.random() * crazyColors.length)]);
        });
      }, 75);
    }

    function disableCrazyLilies() {
      clearInterval(lilyInterval);
      lilyInterval = null;
      document.querySelectorAll('.lily-petal').forEach(p => {
        p.setAttribute('fill', p.dataset.orig);
      });
    }
  </script>
</body>
</html>
